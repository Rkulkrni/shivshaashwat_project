<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contact Us | Shivshaashwat Foundation</title>
    <meta name="description" content="Contact Shivshaashwat Foundation – address, phone, email. Send a message via WhatsApp. Sangli, Maharashtra.">
    <link rel="canonical" href="https://www.shivshaashwatfoundation.org/contact">
    <meta property="og:title" content="Contact Us | Shivshaashwat Foundation">
    <meta property="og:url" content="https://www.shivshaashwatfoundation.org/contact">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2&family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/style.css">
    <link rel="stylesheet" href="/assets/css/component.css">
</head>
<body>
    <header><div id="navbar" aria-label="Main navigation"></div></header>
    <main>
    <!-- Page Header -->
    <section class="py-5 bg-light text-center" aria-labelledby="contact-heading">
        <div class="container">
            <h1 id="contact-heading" class="fw-bold text-logo-sf" data-key="contact_us">Contact Us</h1>
            <p class="text-muted mt-2" data-key="contact_us_desc">
                We would love to hear from you. Reach out to us anytime.
            </p>
        </div>
    </section>

    <!-- Contact Section -->
    <section class="py-5">
        <div class="container">
            <div class="row g-4">

                <!-- Contact Details -->
                <div class="col-lg-4">
                    <div class="p-4 shadow-sm rounded h-100 bg-white">
                        <h4 class="fw-bold mb-3 text-logo-sf" data-key="get_in_touch">Get in Touch</h4>

                        <p>
                            <strong data-key="Address">📍 Address</strong><br>
                            <span data-key="add_1">Shivshaashwat Foundation</span><br>
                            <span data-key="add_2">Sangli, Maharashtra – 416416</span>
                        </p>

                        <p>
                            <strong data-key="phone">📞 Phone</strong><br>
                            <span data-key="num">+91 9XXXXXXXXX</span>
                        </p>

                        <p>
                            <strong data-key="email">📧 Email</strong><br>
                            shivshaswatfoundation@gmail.com
                        </p>
                    </div>
                </div>

                <!-- Contact Form -->
                <div class="col-lg-4">
                    <div class="p-4 shadow-sm rounded h-100 bg-white">
                        <h4 class="fw-bold mb-3 text-logo-sf" data-key="Send_message"></h4>

                        <form id="contactForm">
                            <div class="mb-3">
                                <label class="form-label" data-key="full_name"></label>
                                <input type="text" class="form-control" id="contactName" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label" data-key="message"></label>
                                <textarea class="form-control" id="contactMessage" rows="4" required></textarea>
                            </div>

                            <button type="submit" class="btn btn-success w-100">
                                Send via WhatsApp
                            </button>
                        </form>
                    </div>
                </div>

                <!-- Google Map -->
                <div class="col-lg-4">
                    <div class="shadow-sm rounded overflow-hidden h-100">
                        <iframe src="https://www.google.com/maps?q=Sangli%20Maharashtra&output=embed"
                            width="100%" height="100%" style="border:0;"
                            allowfullscreen="" loading="lazy">
                        </iframe>
                    </div>
                </div>
            </div>
        </div>
    </section>

    </main>
    <footer id="footer"></footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
    <script src="/assets/js/main.js" defer></script>
</body>
</html>
