<!DOCTYPE html>
<html lang="en">

<head>
    <title>Contact Us | Shivshaashwat Foundation</title>
    <div id="headInclude"></div>
    <script>
        fetch('components/head.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('headInclude').innerHTML = data;
            });
    </script>
</head>

<body>

    <!-- Navbar -->
    <div id="navbar"></div>

    <!-- Page Header -->
    <section class="py-5 bg-light text-center">
        <div class="container">
            <h1 class="fw-bold text-logo-sf">Contact Us</h1>
            <p class="text-muted mt-2">
                We would love to hear from you. Reach out to us anytime.
            </p>
        </div>
    </section>

    <!-- Contact Section -->
    <section class="py-5">
        <div class="container">
            <div class="row g-4">

                <!-- Contact Details -->
                <div class="col-lg-4">
                    <div class="p-4 shadow-sm rounded h-100 bg-white">
                        <h4 class="fw-bold mb-3 text-logo-sf">Get in Touch</h4>

                        <p>
                            <strong>📍 Address</strong><br>
                            Shivshaashwat Foundation<br>
                            Sangli, Maharashtra – 416416
                        </p>

                        <p>
                            <strong>📞 Phone</strong><br>
                            +91 9XXXXXXXXX
                        </p>

                        <p>
                            <strong>📧 Email</strong><br>
                            shivshaswatfoundation@gmail.com
                        </p>
                    </div>
                </div>

                <!-- Contact Form (FIX ADDED HERE) -->
                <div class="col-lg-4">
                    <div class="p-4 shadow-sm rounded h-100 bg-white">
                        <h4 class="fw-bold mb-3 text-logo-sf">Send Message</h4>

                        <form id="contactForm">
                            <div class="mb-3">
                                <label class="form-label">Full Name</label>
                                <input type="text" class="form-control" id="contactName" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Message</label>
                                <textarea class="form-control" id="contactMessage" rows="4" required></textarea>
                            </div>

                            <button type="submit" class="btn btn-success w-100">
                                Send via WhatsApp
                            </button>
                        </form>
                    </div>
                </div>

                <!-- Google Map -->
                <div class="col-lg-4">
                    <div class="shadow-sm rounded overflow-hidden h-100">
                        <iframe src="https://www.google.com/maps?q=Sangli%20Maharashtra&output=embed"
                            width="100%" height="100%" style="border:0;"
                            allowfullscreen="" loading="lazy">
                        </iframe>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <div id="footer"></div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Main JS -->
    <script src="assets/js/main.js"></script>

</body>
</html>
